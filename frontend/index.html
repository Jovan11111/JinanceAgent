<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jinance Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23121417'/%3E%3Cpath d='M3 11 L6 7 L9 9 L13 4' stroke='%233DDC84' fill='none' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand">Jinance</div>
        <button id="new-chat" type="button">New chat</button>
      </div>
      <div id="chat-list" class="chat-list"></div>
    </aside>
    <section class="chat">
      <header class="chat-head">
        <h1 id="chat-title">Jinance</h1>
        <span id="skill-tag" hidden></span>
      </header>
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="Message"></textarea>
          <div id="hint" class="hint"></div>
        </div>
        <button id="send" type="submit">Send</button>
      </form>
    </section>
  </div>
  <script src="/markdown.js"></script>
  <script src="/app.js"></script>
</body>
</html>
